name: Generate Version File

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  generate-version:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    
    - name: Generate version file
      run: |
        # Get git information
        GIT_HASH=$(git rev-parse HEAD)
        GIT_SHORT_HASH=$(git rev-parse --short HEAD)
        GIT_BRANCH=${GITHUB_REF#refs/heads/}
        TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
        COMMITTER_NAME=$(git log -1 --pretty=format:'%an')
        COMMITTER_EMAIL=$(git log -1 --pretty=format:'%ae')
        
        # Create version.py file
        cat > cwatm/version.py << EOF
        """
        CWATM Version Information
        
        This file is automatically generated by GitHub Actions.
        Do not edit manually.
        """
        
        __git_hash__ = "${GIT_HASH}"
        __git_short_hash__ = "${GIT_SHORT_HASH}"
        __git_branch__ = "${GIT_BRANCH}"
        __build_timestamp__ = "${TIMESTAMP}"
        __committer_name__ = "${COMMITTER_NAME}"
        __committer_email__ = "${COMMITTER_EMAIL}"
        
        def get_version_info():
            """Return version information as a dictionary"""
            return {
                'git_hash': __git_hash__,
                'git_short_hash': __git_short_hash__,
                'git_branch': __git_branch__,
                'build_timestamp': __build_timestamp__,
                'committer_name': __committer_name__,
                'committer_email': __committer_email__
            }
        
        def print_version_info():
            """Print version information"""
            info = get_version_info()
            print(f"CWATM Version Information:")
            print(f"  Git Hash: {info['git_hash']}")
            print(f"  Short Hash: {info['git_short_hash']}")
            print(f"  Branch: {info['git_branch']}")
            print(f"  Build Time: {info['build_timestamp']}")
            print(f"  Last Committer: {info['committer_name']} <{info['committer_email']}>")
        EOF
    
    - name: Create Pull Request for version file
      run: |
        # Configure git
        git config --local user.name "github-actions[bot]"
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # Check if there are changes to commit
        git add cwatm/version.py
        
        if git diff --staged --quiet; then
          echo "No changes to commit - version file is up to date"
          exit 0
        fi
        
        # Create a new branch for the version update
        BRANCH_NAME="auto-version-update-${GITHUB_SHA:0:7}"
        git checkout -b ${BRANCH_NAME}
        
        # Commit the version file
        git commit -m "Auto-update version file with git hash ${GITHUB_SHA:0:7}
        
        - Git Hash: ${GITHUB_SHA}
        - Branch: ${GITHUB_REF#refs/heads/}
        - Triggered by: ${GITHUB_ACTOR}"
        
        # Push the branch
        git push origin ${BRANCH_NAME}
        
        # Create pull request using GitHub CLI
        gh pr create \
          --title "Auto-update version file (${GITHUB_SHA:0:7})" \
          --body "This PR automatically updates the version file with the latest git information.
        
        **Changes:**
        - Updated \`cwatm/version.py\` with current git hash
        - Git Hash: \`${GITHUB_SHA}\`
        - Branch: \`${GITHUB_REF#refs/heads/}\`
        - Triggered by: @${GITHUB_ACTOR}
        
        This is an automated update generated by GitHub Actions." \
          --base ${GITHUB_REF#refs/heads/} \
          --head ${BRANCH_NAME} \
          --assignee ${GITHUB_ACTOR}
        
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}