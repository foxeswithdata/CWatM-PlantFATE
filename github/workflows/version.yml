name: Generate Version File with github hash

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  generate-version:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # Fetch full history for git describe to work properly
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Generate version information
      id: version
      run: |
        # Get version from git tags or commit hash
        if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
          VERSION=$(git describe --tags --exact-match HEAD)
        else
          VERSION=$(git describe --tags --always --dirty)
        fi
        
        # Alternative: Use commit hash and count
        COMMIT_HASH=$(git rev-parse --short HEAD)
        COMMIT_COUNT=$(git rev-list --count HEAD)
        BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        BRANCH_NAME=${GITHUB_REF#refs/heads/}
        
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
        echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT
        echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT
        echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
        
        echo "Generated version: $VERSION"
    
    - name: Create version.py
      run: |
        
        # Generate version.py file
        cat > cwatm/version.py << EOF
        """
        Version information for the application.
        This file is automatically generated by GitHub Actions.
        Do not edit manually.
        """
        
        __version__ = "${{ steps.version.outputs.version }}"
        __commit__ = "${{ steps.version.outputs.commit_hash }}"
        __commit_count__ = ${{ steps.version.outputs.commit_count }}
        __build_date__ = "${{ steps.version.outputs.build_date }}"
        __branch__ = "${{ steps.version.outputs.branch }}"
        
        
        def get_version():
            """Return the version string."""
            return __version__
        
        
        def get_full_version():
            """Return detailed version information."""
            return {
                'version': __version__,
                'commit': __commit__,
                'commit_count': __commit_count__,
                'build_date': __build_date__,
                'branch': __branch__
            }
        
        
        if __name__ == '__main__':
            print(f"Version: {__version__}")
            print(f"Commit: {__commit__}")
            print(f"Build Date: {__build_date__}")
            print(f"Branch: {__branch__}")
        EOF
        
        echo "Created version.py:"
        cat cwatm/version.py
    
    - name: Upload version.py as artifact
      uses: actions/upload-artifact@v3
      with:
        name: version-file
        path: src/version.py
    

    
